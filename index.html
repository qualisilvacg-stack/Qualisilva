<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Qualisilva">
<meta name="theme-color" content="#1c2e1c">
<title>Qualisilva</title>
<style>
/* ── Base ───────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,serif;background:#f5f2ec;color:#1a1a16;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:Georgia,serif}
.app{max-width:600px;margin:0 auto;min-height:100vh}
.main{padding:14px;padding-bottom:80px}
.note{font-size:12px;color:#666;line-height:1.5}
.empty{text-align:center;color:#aaa;padding:36px;font-size:14px}

/* ── Connexion ──────────────────────────────── */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;gap:24px;text-align:center}
.login-logo{font-size:72px;line-height:1}
.login-title{font-size:26px;font-weight:bold;letter-spacing:3px;color:#1c2e1c}
.login-sub{font-size:14px;color:#666;line-height:1.7;max-width:300px}
.login-note{font-size:11px;color:#aaa;max-width:260px;line-height:1.6}
.btn-google{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #ddd;border-radius:12px;padding:15px 24px;font-size:15px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1);color:#333}

/* ── En-tête et navigation ──────────────────── */
.hdr{background:#1c2e1c;color:#e8e4d8;padding:12px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-size:17px;font-weight:bold;letter-spacing:2px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;cursor:help}
.dot-ok{background:#5fb87a}.dot-pending{background:#f0c040;animation:blink 1s infinite}.dot-err{background:#e07070}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.btn-saisir{background:#4a7c59;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:bold;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:#162316;border-radius:8px;overflow:hidden}
.kpi{padding:7px 4px;text-align:center;border-right:1px solid #1c2e1c}.kpi:last-child{border-right:none}
.kpi-l{font-size:8px;color:#6a9a6a;letter-spacing:.5px;text-transform:uppercase}
.kpi-v{font-size:11px;font-weight:bold;margin-top:2px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:#1c2e1c;display:flex;z-index:50;border-top:2px solid #2d5a27}
.nav-b{flex:1;padding:10px 4px 8px;background:transparent;border:none;cursor:pointer;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:#7aaa7a;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-b.on{background:#2d5a27;color:#e8f4e8}
.nav-ico{font-size:19px;line-height:1}
.toast-box{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#1c2e1c;color:#e8e4d8;padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast-box.show{opacity:1}

/* ── Cartes, filtres, tableaux ──────────────── */
.card{background:#fff;border-radius:12px;border:1px solid #ddd6c8;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.07);margin-bottom:10px}
.card-hdr{padding:12px 16px;border-bottom:2px solid #4a7c59}
.card-hdr h3{font-size:15px;color:#1c2e1c}
.card-body{padding:14px 16px}
.fscroll{overflow-x:auto;white-space:nowrap;margin-bottom:10px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.fbtn{display:inline-block;margin-right:6px;padding:6px 12px;border-radius:20px;border:none;background:#ddd8cc;color:#444;cursor:pointer;font-size:12px}
.fbtn.on{color:#fff;font-weight:bold}
.fbtn.more{background:transparent;border:1px dashed #bbb;color:#888}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:7px 8px;background:#f5f0e6;color:#5a4a2a;font-size:10px;letter-spacing:.5px;text-transform:uppercase;text-align:right}
.tbl td{padding:7px 8px;border-top:1px solid #eee;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.tot{background:#f5f0e6;font-weight:bold}
.tbl.tight{font-size:11px}.tbl.tight th{padding:6px 4px;font-size:9px}.tbl.tight td{padding:6px 4px}.tbl.tight td:first-child{padding-left:10px}
.big-row{display:flex;gap:10px;margin-bottom:12px}
.big{flex:1;text-align:center;background:#f5f0e6;border-radius:8px;padding:10px 6px}
.big-v{font-size:20px;font-weight:bold;color:#1c2e1c}
.big-l{font-size:10px;color:#888;margin-top:2px}
.bar-row{margin-bottom:11px}
.bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar-track{background:#eee9e0;border-radius:4px;height:8px}
.bar-fill{height:8px;border-radius:4px}

/* ── Journal ────────────────────────────────── */
.entry{display:flex;background:#fff;border-radius:12px;border:1px solid #ddd6c8;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:8px}
.e-band{width:6px;flex-shrink:0}
.e-body{flex:1;padding:11px 13px;min-width:0}
.e-top{display:flex;justify-content:space-between;align-items:flex-start}
.e-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.e-lieu{font-size:16px;line-height:1;margin-right:-2px}
.e-date{font-weight:bold;font-size:14px}
.e-h{font-size:12px;color:#555}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.badge-dos{font-size:10px;padding:2px 8px;border-radius:10px;background:#f0e8d0;color:#5a4010}
.badge-st{font-size:10px;padding:1px 7px;border-radius:10px;border:1px solid;background:#fff;white-space:nowrap}
.e-val{font-size:11px;color:#8b6914}
.e-desc{font-size:14px;margin-bottom:5px;line-height:1.4;word-break:break-word}
.e-emm{font-size:12px;color:#2d5a27;line-height:1.5;margin-bottom:2px}
.e-dep{font-size:12px;color:#c0392b;line-height:1.5;margin-bottom:2px}
.e-rem{font-size:12px;color:#999;font-style:italic;margin-top:3px}
.e-acts{display:flex;flex-direction:column;gap:5px;margin-left:8px;flex-shrink:0;padding:8px 8px 8px 0}
.fact .e-acts{padding:0}
.be,.bd{border:none;border-radius:6px;padding:7px 9px;cursor:pointer;font-size:13px}
.be{background:#f0e8d0}.bd{background:#fde8e8}
.bcopy{font-size:11px;padding:4px 10px;border-radius:6px;background:#e8f0e8;border:none;cursor:pointer;color:#2d5a27}

/* ── Formulaires ────────────────────────────── */
.form-wrap{background:#fff;border-radius:12px;border:1px solid #ddd6c8;padding:16px;margin-bottom:10px}
.form-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:2px solid #4a7c59;padding-bottom:10px}
.form-hdr h3{font-size:16px;color:#1c2e1c}
.btn-close{background:none;border:none;font-size:28px;cursor:pointer;color:#aaa;line-height:1;padding:0 4px}
.fg{margin-bottom:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}
.lbl{display:block;font-size:10px;font-weight:bold;color:#5a4a2a;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.lbl small{text-transform:none;font-weight:normal;color:#999;font-size:10px}
.inp{width:100%;border:1px solid #ccc8be;border-radius:8px;padding:12px 13px;font-size:16px;background:#faf8f4;-webkit-appearance:none;appearance:none;color:#1a1a16}
textarea.inp{resize:none}
.unit{display:flex;align-items:center;gap:6px}.unit span{font-size:13px;color:#888;white-space:nowrap}
.tag-picker{display:flex;flex-wrap:wrap;gap:7px}
.tp{padding:9px 13px;border-radius:20px;border:2px solid transparent;background:#eee;color:#444;cursor:pointer;font-size:13px}
.tp.on{color:#fff;font-weight:bold}
.seg{display:flex;gap:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg-grid{display:grid;grid-template-columns:1fr 1fr}
.seg-b{flex:1;padding:10px 8px;border-radius:8px;border:2px solid #ddd8cc;background:#f5f2ec;color:#444;cursor:pointer;font-size:13px}
.seg-b.on{background:#4a7c59;border-color:#4a7c59;color:#fff;font-weight:bold}
.seg-ico{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px}
.seg-ico i{font-style:normal;font-size:22px;line-height:1}
.box{display:flex;flex-direction:column;gap:8px;margin-top:10px;background:#f8fff8;border:1px solid #c8dfc8;border-radius:8px;padding:10px 12px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;flex-shrink:0}
.dep-blk{border:1px solid #c8dfc8;border-radius:10px;overflow:hidden;margin-bottom:13px}
.dep-tog{background:#f0f5f0;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;min-height:48px;font-weight:bold;font-size:14px;color:#2d5a27}
.dep-tog.open{background:#d8f0d8}
.dep-ico{font-size:22px;font-weight:normal}
.dep-inner{padding:13px 15px;background:#f8fff8;display:flex;flex-direction:column;gap:11px}
.hint{font-size:12px;color:#2d5a27;background:#e8f4e8;border-radius:6px;padding:7px 10px}
.prev{background:#d0edce;border-radius:7px;padding:9px 13px;font-size:13px;color:#1a3f1a;margin-top:4px}
.ll{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.li{display:flex;align-items:center;gap:8px;border-radius:6px;padding:8px 10px;background:#fff5f5;font-size:13px}
.li span:first-child{flex:1}
.li-rm{background:none;border:none;cursor:pointer;font-size:22px;padding:0 4px;line-height:1;color:#aaa}
.la{display:flex;gap:7px}
.btn-ad{background:#c0392b;color:#fff;border:none;border-radius:8px;padding:0 13px;font-size:24px;cursor:pointer;flex-shrink:0;min-height:48px;line-height:1}
.btn-save{background:#4a7c59;color:#fff;border:none;border-radius:8px;padding:15px;font-size:16px;font-weight:bold;cursor:pointer;width:100%;margin-top:4px}
.btn-save.violet{background:#7a5c8a;padding:14px;font-size:15px;margin-top:0}
.btn-exp{flex:1;padding:10px;border-radius:8px;border:none;background:#2d5a27;color:#fff;font-weight:bold;cursor:pointer;font-size:13px}
.btn-exp.alt{background:#fff;color:#2d5a27;border:1px solid #2d5a27}
.fact{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid #eee;font-size:12px;color:#555}
.fact-tot{font-size:12px;color:#555;padding:8px 0 2px;border-top:1px solid #eee;margin-top:4px}
.fchk{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:6px 0;border-bottom:1px solid #f0ece4;cursor:pointer}
.fchk input{width:18px;height:18px;flex-shrink:0;margin-top:1px}

/* ── Réglages ───────────────────────────────── */
.item{background:#faf8f4;border:1px solid #ddd;border-radius:8px;padding:10px 11px;margin-bottom:9px}
.row{display:flex;align-items:center;gap:9px}
.row-line{padding:6px 0;border-bottom:1px solid #f0ece4}
.dot-tag{width:26px;height:26px;border-radius:50%;border:2px solid rgba(0,0,0,.1);flex-shrink:0}
.name{flex:1;font-size:14px;font-weight:bold;color:#1c2e1c}
.cnt{font-size:11px;color:#aaa}
.name.off{color:#aaa;font-weight:normal}
.mini-inp{flex:1;border:1px solid #ccc;border-radius:7px;padding:8px 10px;font-size:14px;background:#faf8f4}
.btn-ok{background:#4a7c59;color:#fff;border:none;border-radius:6px;padding:8px 13px;cursor:pointer;font-size:13px}
.btn-mini{background:#f0e8d0;border:none;border-radius:6px;padding:6px 9px;cursor:pointer;font-size:13px}
.btn-mini.del{background:#fde8e8}.btn-mini.grey{background:#eee;padding:8px 9px}
.palette{display:flex;gap:7px;flex-wrap:wrap}
.item .palette{margin-top:8px}
.pal-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.pal-dot.on{border-color:#1a1a16}

/* ── Utilitaires (en dernier pour primer) ───── */
.r{text-align:right}.b{font-weight:bold}.nowrap{white-space:nowrap}
.green{color:#27ae60}.red{color:#c0392b}.gold{color:#8b6914}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast-box" id="toast"></div>
<script>
// ═════════════════════════════════════════════════════════════
// 1. CONFIGURATION  (connexion Google et fichier de données : ne pas modifier)
// ═════════════════════════════════════════════════════════════
const CLIENT_ID = "967084691763-oo1vium2msv1svm44ap0n0pdejg3n07b.apps.googleusercontent.com";
const SCOPES    = "https://www.googleapis.com/auth/drive.appdata";
const FILE_NAME = "qualisilva-data.json";
const ADRESSE   = "11 rue de Mayenne, 72140 Sillé-le-Guillaume";
const PALETTE   = ["#2d5a27","#4a7c59","#6b8f71","#8b6914","#5c7a8a","#7a5c8a","#b05030","#2a6080","#888","#3a3a6a"];
const REGLAGES_DEFAUT = {tauxJour:550, heuresJour:8, tauxKm:0.5, tauxCotis:25.8, prixBombe:0};
const LIEUX = [
  {v:"bureau",    l:"Bureau",    i:"💻"},
  {v:"terrain",   l:"Terrain",   i:"🌲"},
  {v:"rencontre", l:"Rencontre", i:"🤝"},
];
const STATUTS = [
  {v:"facturer", l:"À facturer",     c:"#c0392b"},
  {v:"facture",  l:"Facturé",        c:"#2d5a27"},
  {v:"offert",   l:"Offert",         c:"#8b6914"},
  {v:"nonfact",  l:"Non facturable", c:"#888"},
];

// ═════════════════════════════════════════════════════════════
// 2. ÉTAT DE L'APPLICATION
// ═════════════════════════════════════════════════════════════
const S = {
  screen:"login", view:"journal", syncStatus:"ok", token:null, fileId:null,
  entries:[], factures:[], reglages:{...REGLAGES_DEFAUT}, clientsMasques:[],
  tags:[
    {label:"Prospection",color:"#4a7c59"},{label:"Martelage",color:"#2d5a27"},
    {label:"Analyse/Rédaction",color:"#6b8f71"},{label:"Formation/Veille",color:"#8b6914"},
    {label:"Admin",color:"#7a5c8a"},
  ],
  filterTag:"Tous", filterDos:"Tous", filterStatut:"Tous", year:String(new Date().getFullYear()), voirMasques:false,
  form:null, editId:null, showDep:false, depAuto:false,        // saisie d'une entrée
  factForm:null, factEditId:null,                              // saisie d'une facture
  editTagI:null, newTagLbl:"", newTagCol:"#4a7c59", editCli:null, // réglages
};

// ═════════════════════════════════════════════════════════════
// 3. OUTILS
// ═════════════════════════════════════════════════════════════
const $   = id => document.getElementById(id);
const on  = (id,ev,fn) => { const el=$(id); if(el) el[ev]=fn; };
const all = (sel,fn) => document.querySelectorAll(sel).forEach(fn);
const num      = v => Number(v)||0;
const parseNum = v => parseFloat(String(v??"").replace(",","."))||0;
const dec      = v => String(v??"").replace(".",",");                 // 3.5 → "3,5"
const sum      = (arr,fn) => arr.reduce((s,x)=>s+fn(x),0);
const milliers = s => s.replace(/\B(?=(\d{3})+(?!\d))/g," ");
const fmt  = n => milliers((Math.round(num(n)*100)/100).toFixed(2).replace(".",","))+" €";
const fmt0 = n => milliers(String(Math.round(num(n))))+" €";
const fmtH = h => dec(Math.round(num(h)*100)/100)+" h";
const fmtP = x => Math.round(x*100)+" %";
const fmtD = d => { const [y,m,j]=(d||"").split("-"); return `${j}/${m}/${y}`; };
const esc  = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const today  = () => new Date().toISOString().slice(0,10);
const inYear = d => (d||"").slice(0,4)===S.year;
const R      = () => S.reglages;
const tagCol = lbl => (S.tags.find(t=>t.label===lbl)||{color:"#888"}).color;
const statut = v => STATUTS.find(s=>s.v===v)||STATUTS[0];
const lieuOf = v => LIEUX.find(x=>x.v===v);
let toastTimer;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2500);
}

// ═════════════════════════════════════════════════════════════
// 4. DONNÉES : lecture, conversion des anciennes versions, clients
//    (rien n'est supprimé : les anciennes lignes « dépenses / recettes »
//     restent rangées dans le champ « ancien » de chaque entrée)
// ═════════════════════════════════════════════════════════════
function inferLieu(e){                       // pour les entrées saisies avant l'ajout du lieu
  if(e.lieu) return e;
  const km=e.deplacement&&num(e.deplacement.km)>0, em=/emmen/i.test(e.remarque||"");
  const lieu=(km||em)?(e.tags.includes("Prospection")?"rencontre":"terrain"):(e.tags.includes("Martelage")?"terrain":"bureau");
  return {...e,lieu,emmenee:!!e.emmenee||(em&&!km),emmeneePar:e.emmeneePar||(em&&/papa/i.test(e.remarque)?"Papa":"")};
}
function migrateData(data){
  data=data||{};
  const entries=(data.entries||[]).map(e=>inferLieu(Array.isArray(e.tags)
    ? {intervenants:1,statut:"facturer",bombes:0,frais:[],deplacement:null,remarque:"",dossier:"",...e}
    : { // version 1 de l'outil
        id:e.id, date:e.date, heures:num(e.heures), description:e.description||"",
        tags:e.tag?[e.tag]:[], dossier:e.dossier||"", intervenants:1,
        statut:(["Prospection","Formation/Veille"].includes(e.tag)||!e.dossier)?"nonfact":"facturer",
        deplacement:e.deplacement||null, bombes:0, frais:[], remarque:e.remarque||"",
        ancien:{tag:e.tag, depenses:e.depenses||[], recettes:e.recettes||[]},
      }));
  return {version:2, entries,
    tags:Array.isArray(data.tags)&&data.tags.length?data.tags:S.tags,
    factures:Array.isArray(data.factures)?data.factures:[],
    reglages:{...REGLAGES_DEFAUT,...(data.reglages||{})},
    clientsMasques:Array.isArray(data.clientsMasques)?data.clientsMasques:[]};
}
const dataToSave = () => ({version:2, entries:S.entries, tags:S.tags, factures:S.factures, reglages:S.reglages, clientsMasques:S.clientsMasques});
function applyData(data){ const d=migrateData(data); Object.assign(S,{entries:d.entries, tags:d.tags, factures:d.factures, reglages:d.reglages, clientsMasques:d.clientsMasques}); }

// Clients
const sortFr = arr => [...arr].sort((a,b)=>a.localeCompare(b));
const dossiersEntries = () => sortFr(new Set(S.entries.map(e=>e.dossier).filter(Boolean)));     // filtres du journal
const dossiersTous = () => sortFr(new Set([...S.entries,...S.factures].map(x=>x.dossier).filter(Boolean)));
const dossiers = () => {                                                                       // suggestions, sans doublon de casse
  const m=new Map(); dossiersTous().forEach(d=>{ if(!m.has(d.toLowerCase())) m.set(d.toLowerCase(),d); });
  return [...m.values()];
};
function harmonizeClients(){                 // aligne l'écriture des clients des factures sur celle des entrées
  const ref=new Map(S.entries.filter(e=>e.dossier).map(e=>[e.dossier.toLowerCase(),e.dossier]));
  let changed=false;
  S.factures=S.factures.map(f=>{ const r=ref.get((f.dossier||"").toLowerCase()); if(r&&r!==f.dossier){changed=true;return {...f,dossier:r};} return f; });
  return changed;
}
// Clients masqués du bandeau du journal (contacts, confrères…) : toujours comptés dans les analyses
const estMasque = d => S.clientsMasques.includes(d);
const basculerMasque = d => { S.clientsMasques=estMasque(d)?S.clientsMasques.filter(x=>x!==d):[...S.clientsMasques,d]; };
function renameClient(oldName,newName){
  const fusion=dossiersTous().includes(newName), masque=estMasque(oldName);
  const ren=x=>x.dossier===oldName?{...x,dossier:newName}:x;
  S.entries=S.entries.map(ren); S.factures=S.factures.map(ren);
  S.clientsMasques=S.clientsMasques.filter(x=>x!==oldName);      // en cas de fusion, le client gardé garde son réglage
  if(masque&&!fusion) S.clientsMasques.push(newName);
  if(S.filterDos===oldName) S.filterDos=newName;
}
const years = () => [...new Set([...S.entries,...S.factures].map(x=>(x.date||"").slice(0,4)).concat(String(new Date().getFullYear())).filter(Boolean))].sort().reverse();

// ═════════════════════════════════════════════════════════════
// 5. CALCULS
// ═════════════════════════════════════════════════════════════
const tauxH       = () => R().tauxJour/R().heuresJour;
const fraisKm     = e => e.deplacement ? num(e.deplacement.km)*R().tauxKm : 0;
const peage       = e => e.deplacement ? num(e.deplacement.peage) : 0;
const fraisConso  = e => num(e.bombes)*R().prixBombe;
const fraisAutres = e => sum(e.frais||[],f=>num(f.montant));
const fraisTot    = e => fraisKm(e)+peage(e)+fraisConso(e)+fraisAutres(e);
const heuresTravail    = e => num(e.heures)*(num(e.intervenants)||1);     // binôme compté pour les deux
const valeurTemps      = e => num(e.heures)*tauxH();                      // ton temps seul
const valeurFacturable = e => heuresTravail(e)*tauxH();
const estFacturable    = e => e.statut==="facturer"||e.statut==="facture";
const valeurEntree     = e => estFacturable(e)?valeurFacturable(e):valeurTemps(e);

function calcAnalyse(){                        // les 3 niveaux, pour l'année sélectionnée
  const E=S.entries.filter(e=>inYear(e.date)), F=S.factures.filter(f=>inYear(f.date));
  const de=st=>E.filter(e=>e.statut===st);
  const parClient={}, parTag={};
  const cl=d=>parClient[d||"(sans client)"]??={h:0,valeur:0,valeur2:0,aFacturer:0,facture:0,hFact:0};
  E.forEach(e=>{
    const c=cl(e.dossier);
    c.h+=num(e.heures); c.valeur+=valeurTemps(e); c.valeur2+=valeurEntree(e);
    if(e.statut==="facture")  c.hFact+=heuresTravail(e);
    if(e.statut==="facturer") c.aFacturer+=valeurFacturable(e);
    const t=e.tags?.length?e.tags:["(sans activité)"];
    t.forEach(l=>parTag[l]=(parTag[l]||0)+num(e.heures)/t.length);   // réparti entre les activités
  });
  F.forEach(f=>cl(f.dossier).facture+=num(f.honoraires));
  // Niveau 1 — valeur du temps
  const heures=sum(E,e=>num(e.heures)), valeur=heures*tauxH();
  // Niveau 2 — taux de facturation
  const honoraires=sum(F,f=>num(f.honoraires)), valeur2=sum(E,valeurEntree), hFact=sum(de("facture"),heuresTravail);
  const resteAFacturer=sum(de("facturer"),valeurFacturable);
  // Niveau 3 — revenu net
  const ca=honoraires+sum(F,f=>num(f.frais)), cotis=ca*R().tauxCotis/100;
  const route=sum(E,e=>fraisKm(e)+peage(e)), conso=sum(E,fraisConso), autres=sum(E,fraisAutres);
  const net=ca-cotis-route-conso-autres, netSiFacture=net+resteAFacturer*(1-R().tauxCotis/100);
  const encaisse=sum(F,f=>num(f.encaisse)), parH=x=>heures>0?x/heures:0;
  return {E,F,heures,valeur,parClient,parTag,fraisFactures:sum(F,f=>num(f.frais)),
    honoraires,valeur2,hFact,resteAFacturer,taux:valeur2>0?honoraires/valeur2:0,
    prixJourReel:hFact>0?honoraires/(hFact/R().heuresJour):0,
    offert:sum(de("offert"),valeurTemps), nonfact:sum(de("nonfact"),valeurTemps),
    ca,cotis,route,conso,autres,net,netH:parH(net),netSiFacture,netSiFactureH:parH(netSiFacture),
    encaisse,cotisEncaisse:encaisse*R().tauxCotis/100};
}

let saveTimer=null;
function scheduleSave(){ setSyncDot("pending"); clearTimeout(saveTimer); saveTimer=setTimeout(doSave,2000); }
async function doSave(){
  if(!S.token||!S.fileId) return;
  try{
    const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${S.fileId}?uploadType=media`,{
      method:"PATCH", headers:{Authorization:"Bearer "+S.token,"Content-Type":"application/json"}, body:JSON.stringify(dataToSave())});
    if(!r.ok) throw new Error("HTTP "+r.status);
    setSyncDot("ok"); toast("✓ Sauvegardé");
  }catch(e){ setSyncDot("err"); toast("⚠ Erreur de sauvegarde"); }
}
function setSyncDot(s){
  S.syncStatus=s; const d=$("sync-dot");
  if(d){ d.className="dot dot-"+s; d.title={ok:"Synchronisé",pending:"Sauvegarde…",err:"Erreur"}[s]||""; }
}
async function signIn(){
  const params=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:location.origin+location.pathname,response_type:"token",scope:SCOPES,prompt:"select_account"});
  const popup=window.open("https://accounts.google.com/o/oauth2/v2/auth?"+params,"_blank","width=520,height=620");
  return new Promise((res,rej)=>{
    const t=setInterval(()=>{
      try{
        if(!popup||popup.closed){clearInterval(t);rej(new Error("fermé"));return;}
        const u=popup.location.href;
        if(u.includes("access_token")){clearInterval(t);popup.close();res(new URLSearchParams(u.split("#")[1]).get("access_token"));}
      }catch(e){}
    },400);
  });
}
async function driveLoad(token){
  const auth={Authorization:"Bearer "+token};
  const j=await (await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27qualisilva-data.json%27&fields=files(id)",{headers:auth})).json();
  if(j.files&&j.files.length>0){
    S.fileId=j.files[0].id;
    return await (await fetch("https://www.googleapis.com/drive/v3/files/"+S.fileId+"?alt=media",{headers:auth})).json();
  }
  const data=dataToSave(), form=new FormData();
  form.append("metadata",new Blob([JSON.stringify({name:FILE_NAME,parents:["appDataFolder"]})],{type:"application/json"}));
  form.append("file",new Blob([JSON.stringify(data)],{type:"application/json"}));
  S.fileId=(await (await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:auth,body:form})).json()).id;
  return data;
}

// ── Analyses ─────────────────────────────────────────────────
function renderAnalyse(a){
  const clients=Object.entries(a.parClient).sort((x,y)=>y[1].valeur-x[1].valeur);
  const tagMax=Math.max(...Object.values(a.parTag),1);
  const prixJour=c=>c.hFact>0?c.facture/(c.hFact/R().heuresJour):0;
  const ligne=(nom,h,fact,taux,pj,af)=>`<tr><td class="b">${nom}</td><td>${fmtH(h)}</td><td class="green">${fmt0(fact)}</td><td class="b">${taux}</td><td class="b ${pj>=R().tauxJour-0.5?"green":"gold"}">${pj>0?fmt0(pj):"—"}</td><td class="red">${af>0.5?fmt0(af):"—"}</td></tr>`;
  const bilan=[["Chiffre d'affaires facturé (honoraires + frais)",fmt(a.ca)],
    [`– Cotisations Urssaf (${dec(R().tauxCotis)} %)`,"– "+fmt(a.cotis),"red"],["– Km et péages","– "+fmt(a.route),"red"],
    ["– Consommables","– "+fmt(a.conso),"red"],["– Autres frais","– "+fmt(a.autres),"red"]];
  return chips(years().map(y=>({v:y,l:y})),S.year,"year")

  + card("1 · La valeur de ton temps","#4a7c59",
    `<div class="big-row">${bigBox(fmtH(a.heures),"travaillées")}${bigBox(fmt0(a.valeur),`valeur à ${fmt0(R().tauxJour)} / ${R().heuresJour} h`,"#8b6914")}</div>
    ${Object.entries(a.parTag).sort((x,y)=>y[1]-x[1]).map(([t,h])=>`<div class="bar-row">
      <div class="bar-top"><span class="b" style="color:${tagCol(t)}">${esc(t)}</span><span style="font-size:11px;color:#888">${fmtH(h)} · ${fmt0(h*tauxH())}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(h/tagMax*100)}%;background:${tagCol(t)}"></div></div></div>`).join("")}
    <div class="note">Une entrée avec plusieurs activités est répartie à parts égales entre elles.</div>`)

  + card("2 · Ton taux de facturation","#8b6914",
    `<div class="card-body" style="padding-bottom:6px">
      <div class="big-row">${bigBox(fmtP(a.taux),"de ton temps facturé","#2d5a27")}${bigBox(fmt0(a.honoraires),"honoraires facturés")}</div>
      <div class="note" style="margin-bottom:8px">Temps offert : <strong>${fmt0(a.offert)}</strong> · non facturable : <strong>${fmt0(a.nonfact)}</strong> · encore à facturer : <strong>${fmt0(a.resteAFacturer)}</strong></div>
    </div>
    <div style="overflow-x:auto"><table class="tbl tight">
      <thead><tr><th>Client</th><th>Heures</th><th>Facturé</th><th>Taux</th><th>€/j réel</th><th>À fact.</th></tr></thead>
      <tbody>${clients.map(([d,c])=>ligne(esc(d),c.h,c.facture,c.valeur2>0?fmtP(c.facture/c.valeur2):"—",prixJour(c),c.aFacturer)).join("")}
      <tr class="tot"><td>Total</td><td>${fmtH(a.heures)}</td><td>${fmt0(a.honoraires)}</td><td>${fmtP(a.taux)}</td><td>${a.prixJourReel>0?fmt0(a.prixJourReel):"—"}</td><td>${fmt0(a.resteAFacturer)}</td></tr></tbody>
    </table></div>
    <div class="note" style="padding:8px 16px 12px">Taux = honoraires facturés ÷ valeur de tout le temps passé (binôme compté pour les deux). <strong>€/j réel</strong> = honoraires facturés ÷ journées couvertes par les factures (entrées « Facturé », analyse comprise, ${R().heuresJour} h = 1 jour) : c'est ce que te rapporte réellement une journée de travail, à comparer à ton tarif de ${fmt0(R().tauxJour)}. « À fact. » = valeur des entrées encore « À facturer ».</div>`, null)

  + card("3 · Ce que tu gagnes vraiment","#2a6080",
    `<table class="tbl"><tbody>
      ${bilan.map(([l,v,c])=>`<tr><td>${l}</td><td class="${c||""}">${v}</td></tr>`).join("")}
      <tr class="tot"><td>= Revenu net (avant impôt)</td><td>${fmt(a.net)}</td></tr>
      <tr class="b"><td>÷ ${fmtH(a.heures)} = par heure travaillée</td><td class="${a.netH>=0?"green":"red"}">${a.heures>0?fmt(a.netH):"—"}</td></tr>
    </tbody></table>
    ${a.resteAFacturer>0.5?`<div class="note" style="margin-top:8px">Si tu factures à ton tarif tout ce qui est encore « À facturer » (${fmt0(a.resteAFacturer)}) : revenu net <strong>${fmt(a.netSiFacture)}</strong>, soit <strong>${fmt(a.netSiFactureH)} / h</strong>.</div>`:""}
    <div class="note" style="margin-top:8px">Trésorerie : encaissé <strong>${fmt(a.encaisse)}</strong> → cotisations correspondantes à prévoir : <strong>${fmt(a.cotisEncaisse)}</strong>.</div>`)

  + card("⬇ Exporter mes données","#2d5a27",
    `<div class="note" style="margin-bottom:10px">${S.entries.length} entrées, ${S.factures.length} factures. L'export télécharge une copie ; tes données restent inchangées dans ton Drive.</div>
    <div class="btns">
      <button type="button" class="btn-exp" id="btn-exp-csv">Journal (CSV)</button>
      <button type="button" class="btn-exp" id="btn-exp-km">Relevé km (CSV)</button>
      <button type="button" class="btn-exp alt" id="btn-exp-json">Sauvegarde (JSON)</button>
    </div>`);
}

  const clients=dossiersTous().map(n=>{
    const ne=S.entries.filter(e=>e.dossier===n).length, nf=S.factures.filter(f=>f.dossier===n).length, m=estMasque(n);

      ? `<div class="item row"><input class="mini-inp" id="cli-inp" value="${esc(n)}" list="cli-list"><datalist id="cli-list">${dossiersTous().filter(x=>x!==n).map(x=>`<option value="${esc(x)}">`).join("")}</datalist><button class="btn-ok" id="btn-clisave">OK</button><button class="btn-mini grey" id="btn-clican">×</button></div>`

  }).join("");
  const tags=S.tags.map((t,i)=>`<div class="item">
      ${S.editTagI===i
        ? `<div class="row"><input class="mini-inp" id="te-inp" value="${esc(t.label)}"><button class="btn-ok" data-savete="${i}">OK</button><button class="btn-mini grey" id="btn-cante">×</button></div>`
        : `<div class="row"><div class="dot-tag" style="background:${t.color}"></div><span class="name">${esc(t.label)}</span><span class="cnt">${pl(nbTag[t.label]||0,"entrée")}</span><button class="btn-mini" data-editte="${i}">✏️</button><button class="btn-mini del" data-delte="${i}">🗑</button></div>`}

    `<div class="g2">${field("rg-tj","Tarif journée",dec(r.tauxJour),"","€")}${field("rg-hj","Heures par journée",dec(r.heuresJour),"","h")}</div>
    <div class="g2">${field("rg-km","Indemnité km",dec(r.tauxKm),"","€/km")}${field("rg-cot","Cotisations Urssaf",dec(r.tauxCotis),"","%")}</div>
    <div class="g2">${field("rg-bombe","Prix d'une bombe",dec(r.prixBombe),"","€")}<div></div></div>

    <div class="note" style="margin-top:8px">Valeur d'une heure : ${fmt(tauxH())}. Cotisations : 25,6 % (BNC) + 0,2 % (formation professionnelle).</div>`)
  + card("👥 Mes clients","#5a4010",
    `<div class="note" style="margin-bottom:8px">👁 / 🙈 : afficher ou masquer le client dans le bandeau du journal (contacts, confrères…). Ses heures restent comptées dans les analyses.<br>✏️ : renommer met à jour toutes ses entrées et factures ; donner le nom d'un client existant fusionne les deux.</div>${clients||`<div class="note">Aucun client.</div>`}`,"padding-top:10px")
  + card("🏷 Mes activités (tags)","#7a5c8a",
    `${tags}<div style="display:flex;flex-direction:column;gap:11px;margin-top:6px">
      <div><label class="lbl">Nouvelle activité</label><input class="inp" id="nt-lbl" placeholder="Ex : Expertise, Vente de bois…" value="${esc(S.newTagLbl)}"></div>
      <div class="palette" style="gap:10px">${PALETTE.map(c=>`<div class="pal-dot${S.newTagCol===c?" on":""}" style="background:${c};width:28px;height:28px" data-newcol="${c}"></div>`).join("")}</div>
      <button class="btn-save violet" id="btn-addtag">Ajouter cette activité</button>
    </div>`,"padding-top:10px")
  + card("⬆ Importer une sauvegarde","#b05030",
    `<div class="note" style="margin-bottom:10px">Remplace <strong>toutes</strong> les données de l'outil par celles d'un fichier JSON (export « Sauvegarde »). Fais d'abord un export de sécurité.</div>

function readForm(){
  const dehors=S.form.lieu&&S.form.lieu!=="bureau", emm=dehors&&$("f-emm").checked;
  const dep=S.showDep?{adresseDepart:$("f-dep-from").value||ADRESSE, adresseArrivee:$("f-dep-to").value||"",
                        km:parseNum($("f-km").value), peage:parseNum($("f-peage").value), allerRetour:true}:null;
  return {
    date:$("f-date").value||today(), heures:parseNum($("f-heures").value), description:$("f-desc").value||"",
    tags:[...(S.form.tags||[])], dossier:($("f-dos").value||"").trim(),
    lieu:S.form.lieu||"", emmenee:!!emm, emmeneePar:emm?($("f-emm-par").value||"").trim():"",
    intervenants:S.form.intervenants||1, statut:S.form.statut||"facturer",
    deplacement:dep&&(dep.km>0||dep.peage>0)?dep:null,
    bombes:parseNum($("f-bombes").value), frais:S.form.frais||[], remarque:$("f-rem").value||"",
    ...(S.form.statut==="facture"&&S.form.factureNum?{factureNum:S.form.factureNum}:{}),
    ...(S.form.ancien?{ancien:S.form.ancien}:{}),
  };
}
function updatePreviews(){
  const km=parseNum($("f-km")?.value), pe=parseNum($("f-peage")?.value), b=parseNum($("f-bombes")?.value);
  const dp=$("dep-prev"), bp=$("bombe-prev");
  const show=(el,cond,html)=>{ if(el){ el.style.display=cond?"":"none"; el.innerHTML=cond?html:""; } };
  show(dp,km>0||pe>0,`${dec(km)} km × ${dec(R().tauxKm)} € = <strong>${fmt(km*R().tauxKm)}</strong>${pe>0?` · Péage <strong>${fmt(pe)}</strong>`:""} → <strong>${fmt(km*R().tauxKm+pe)}</strong>`);
  show(bp,b>0,R().prixBombe>0?`${dec(b)} × ${fmt(R().prixBombe)} = <strong>${fmt(b*R().prixBombe)}</strong>`:"Prix d'une bombe à régler dans Réglages");
}
function openDep(open){
  S.showDep=open;
  $("dep-toggle").classList.toggle("open",open);
  $("dep-toggle").querySelector(".dep-ico").textContent=open?"−":"+";
  $("dep-inner").style.display=open?"":"none";
}
function prefillTrip(){                       // reprend le trajet de la dernière visite chez ce client
  if(parseNum($("f-km").value)) return;
  const client=($("f-dos").value||"").trim();
  const t=S.entries.filter(e=>client&&e.dossier===client&&e.deplacement&&num(e.deplacement.km)>0).sort((a,b)=>b.date.localeCompare(a.date))[0]?.deplacement;
  if(!t) return;
  openDep(true);
  $("f-dep-from").value=t.adresseDepart||ADRESSE; $("f-dep-to").value=t.adresseArrivee||"";
  $("f-km").value=dec(t.km); $("f-peage").value=t.peage?dec(t.peage):"";
  S.depAuto=true; $("dep-auto").style.display=""; updatePreviews();
}
function refreshFraisList(){
  $("frais-list").innerHTML=fraisListHtml();
  all("[data-rmfrais]",b=>b.onclick=()=>{ S.form.frais=S.form.frais.filter((_,i)=>i!=b.dataset.rmfrais); refreshFraisList(); });
}
// Met à jour l'apparence d'un groupe de boutons à choix unique sans redessiner l'écran
function selectSeg(attr,btn,items){
  all(`[data-${attr}]`,x=>{ const sel=x===btn, it=items.find(i=>String(i.v)===x.dataset[attr]);
    x.classList.toggle("on",sel); x.style.background=sel&&it?.c?it.c:""; x.style.borderColor=sel&&it?.c?it.c:""; });
}
function readFactForm(){
  const sel={...(S.factForm.sel||{})}, opt=id=>$(id).value===""?"":parseNum($(id).value);
  all("[data-fsel]",c=>sel[c.dataset.fsel]=c.checked);
  return {...S.factForm, numero:$("ff-num").value.trim(), date:$("ff-date").value||today(), dossier:$("ff-dos").value.trim(),
          honoraires:opt("ff-hon"), frais:opt("ff-frais"), encaisse:opt("ff-enc"), sel};
}

function downloadFile(name,content,mime){
  const url=URL.createObjectURL(new Blob([content],{type:mime})), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },1000);
}
const csvN = n => dec(Math.round(num(n)*100)/100);
const csv  = rows => "﻿"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
const parDate = arr => [...arr].sort((a,b)=>a.date.localeCompare(b.date));
const EXPORTS = {
  json:()=>{ downloadFile(`qualisilva-sauvegarde-${today()}.json`,JSON.stringify({exporte_le:new Date().toISOString(),...dataToSave()},null,2),"application/json"); toast("⬇ Sauvegarde téléchargée"); },
  csv:()=>{
    const head=["Date","Lieu","Emmenée par","Client","Activités","Description","Heures","Intervenants","Statut","N° facture","Valeur","Km A/R","Frais km","Péage","Bombes","Consommables","Autres frais","Détail autres frais","Total frais","Remarque"];
    const rows=parDate(S.entries).map(e=>[e.date,lieuOf(e.lieu)?.l||"",e.emmenee?(e.emmeneePar||"oui"):"",e.dossier,(e.tags||[]).join(", "),e.description,
      csvN(e.heures),e.intervenants||1,statut(e.statut).l,e.factureNum||"",csvN(valeurEntree(e)),e.deplacement?csvN(e.deplacement.km):"",
      csvN(fraisKm(e)),csvN(peage(e)),csvN(e.bombes),csvN(fraisConso(e)),csvN(fraisAutres(e)),
      (e.frais||[]).map(f=>`${f.libelle} : ${csvN(f.montant)}`).join(" | "),csvN(fraisTot(e)),e.remarque]);
    downloadFile(`qualisilva-journal-${today()}.csv`,csv([head,...rows]),"text/csv;charset=utf-8"); toast("⬇ Journal CSV téléchargé");
  },
  km:()=>{
    const head=["Date","Départ","Arrivée","Client","Distance A/R (km)","Indemnité","Péage","Total frais","Description"];
    const rows=parDate(S.entries.filter(e=>e.deplacement&&(num(e.deplacement.km)>0||num(e.deplacement.peage)>0))).map(e=>[e.date,e.deplacement.adresseDepart,e.deplacement.adresseArrivee,e.dossier,
      csvN(e.deplacement.km),csvN(fraisKm(e)),csvN(peage(e)),csvN(fraisKm(e)+peage(e)),e.description]);
    downloadFile(`qualisilva-releve-km-${today()}.csv`,csv([head,...rows]),"text/csv;charset=utf-8"); toast("⬇ Relevé km téléchargé");
  },
};

const go = vue => { S.view=vue; render(); };
const sauver = msg => { scheduleSave(); render(); if(msg) toast(msg); };

function bindLogin(){
  $("btn-signin").onclick=async()=>{
    try{
      $("btn-signin").textContent="Connexion…";
      S.token=await signIn(); applyData(await driveLoad(S.token)); S.screen="app"; render();
    }catch(e){ alert("Connexion annulée"); render(); }
  };
}

function bindApp(){
  ["journal","factures","analyse","reglages"].forEach(v=>on("nav-"+v,"onclick",()=>go(v)));
  on("btn-new","onclick",()=>{ Object.assign(S,{form:nouvelleEntree(),showDep:false,depAuto:false,editId:null}); go("saisie"); });
  // Filtres
  all("[data-ftag]",b=>b.onclick=()=>{S.filterTag=b.dataset.ftag;render();});
  all("[data-fdos]",b=>b.onclick=()=>{S.filterDos=b.dataset.fdos;render();});
  on("btn-masques","onclick",()=>{S.voirMasques=!S.voirMasques;render();});
  all("[data-fstat]",b=>b.onclick=()=>{S.filterStatut=b.dataset.fstat;render();});
  all("[data-year]",b=>b.onclick=()=>{S.year=b.dataset.year;render();});
  // Entrées du journal
  const entree=id=>S.entries.find(e=>String(e.id)===id);
  all("[data-edit]",b=>b.onclick=()=>{ const e=entree(b.dataset.edit); if(!e) return;
    Object.assign(S,{form:JSON.parse(JSON.stringify(e)),showDep:!!e.deplacement,depAuto:false,editId:e.id}); go("saisie"); });
  all("[data-copy]",b=>b.onclick=()=>{ const e=entree(b.dataset.copy); if(!e) return;
    const {ancien,factureNum,...copie}=JSON.parse(JSON.stringify(e));
    S.entries.push({...copie,id:Date.now(),date:today(),statut:copie.statut==="facture"?"facturer":copie.statut});
    sauver("📋 Entrée dupliquée à la date du jour"); });
  all("[data-del]",b=>b.onclick=()=>{ if(!confirm("Supprimer cette entrée ?")) return;
    S.entries=S.entries.filter(e=>String(e.id)!==b.dataset.del); sauver("🗑 Supprimée"); });
  // Exports
  Object.keys(EXPORTS).forEach(k=>on("btn-exp-"+k,"onclick",EXPORTS[k]));
  // Écrans avec formulaire
  ({saisie:bindSaisie, factures:bindFactures, reglages:bindReglages}[S.view]||(()=>{}))();
}

function bindSaisie(){
  updatePreviews();
  on("btn-cancel","onclick",()=>go("journal"));
  all("[data-tag]",b=>b.onclick=()=>{
    const l=b.dataset.tag, t=S.tags.find(x=>x.label===l);
    S.form.tags=S.form.tags.includes(l)?S.form.tags.filter(x=>x!==l):[...S.form.tags,l];
    const sel=S.form.tags.includes(l);
    b.classList.toggle("on",sel); b.style.background=sel?t.color:""; b.style.borderColor=sel?t.color:"transparent";
  });
  all("[data-lieu]",b=>b.onclick=()=>{
    S.form.lieu=b.dataset.lieu; selectSeg("lieu",b,LIEUX);
    const dehors=S.form.lieu!=="bureau";
    $("emm-row").style.display=dehors?"":"none";
    if(dehors&&!$("f-emm").checked&&!S.showDep){ openDep(true); prefillTrip(); }
  });
  on("f-emm","onchange",()=>{ $("f-emm-par").style.display=$("f-emm").checked?"":"none"; });
  all("[data-st]",b=>b.onclick=()=>{ S.form.statut=b.dataset.st; selectSeg("st",b,STATUTS); });
  all("[data-int]",b=>b.onclick=()=>{ S.form.intervenants=Number(b.dataset.int); selectSeg("int",b,[]); });
  on("dep-toggle","onclick",()=>{ openDep(!S.showDep); if(S.showDep) prefillTrip(); });
  on("f-dos","onchange",()=>{ if(!S.editId) prefillTrip(); });
  ["f-km","f-peage","f-bombes"].forEach(id=>on(id,"oninput",updatePreviews));
  refreshFraisList();
  on("btn-addfrais","onclick",()=>{
    const lbl=$("nd-lbl").value.trim(), amt=parseNum($("nd-amt").value);
    if(!lbl||!(amt>0)) return;
    S.form.frais=[...(S.form.frais||[]),{libelle:lbl,montant:amt}];
    $("nd-lbl").value=""; $("nd-amt").value=""; refreshFraisList();
  });
  on("btn-save","onclick",()=>{
    const f=readForm();
    const erreur=!f.description.trim()?"Merci d'ajouter une description."
      :!f.tags.length?"Merci de choisir au moins une activité."
      :!f.lieu?"Indique où tu étais : bureau, terrain ou rencontre."
      :(f.lieu!=="bureau"&&!f.emmenee&&!(f.deplacement&&num(f.deplacement.km)>0))?"Tu étais en déplacement : indique les km dans « Déplacement », ou coche « Emmenée par quelqu'un »."
      :"";
    if(erreur){ alert(erreur); if(erreur.startsWith("Tu étais")) openDep(true); return; }
    const modif=!!S.editId;
    S.entries=modif?S.entries.map(e=>e.id===S.editId?{...f,id:S.editId}:e):[...S.entries,{...f,id:Date.now()}];
    S.editId=null; S.view="journal"; sauver(modif?"✓ Modifié":"✓ Entrée ajoutée");
  });
}

function bindFactures(){
  const fermer=()=>{ S.factForm=null; S.factEditId=null; };
  on("btn-fnew","onclick",()=>{ S.factForm={numero:"",date:today(),dossier:"",honoraires:"",frais:"",encaisse:"",sel:{}}; S.factEditId=null; render(); });
  on("btn-fcancel","onclick",()=>{ fermer(); render(); });
  on("ff-dos","onchange",()=>{ S.factForm={...readFactForm(),sel:{}}; render(); });
  all("[data-fedit]",b=>b.onclick=()=>{ const f=S.factures.find(x=>String(x.id)===b.dataset.fedit); if(!f) return;
    S.factForm={...f,numeroOrig:f.numero,sel:{}}; S.factEditId=f.id; render(); window.scrollTo(0,0); });
  all("[data-fdel]",b=>b.onclick=()=>{ const f=S.factures.find(x=>String(x.id)===b.dataset.fdel); if(!f) return;
    if(!confirm("Supprimer cette facture ? Ses entrées repasseront « À facturer ».")) return;
    S.entries=S.entries.map(e=>{ if(e.statut==="facture"&&e.factureNum===f.numero&&e.dossier===f.dossier){ const {factureNum,...r}=e; return {...r,statut:"facturer"}; } return e; });
    S.factures=S.factures.filter(x=>x.id!==f.id); sauver("🗑 Facture supprimée"); });
  on("btn-fsave","onclick",()=>{
    const ff=readFactForm();
    if(!ff.numero||!ff.dossier){ alert("Merci d'indiquer le numéro et le client."); return; }
    const f={numero:ff.numero,date:ff.date,dossier:ff.dossier,honoraires:num(ff.honoraires),frais:num(ff.frais),encaisse:num(ff.encaisse)};
    const cand=new Set(factCandidates(ff).map(e=>e.id));
    S.entries=S.entries.map(e=>{
      if(!cand.has(e.id)) return e;
      if(isChecked(e,ff)) return {...e,statut:"facture",factureNum:f.numero};
      if(e.statut==="facture"){ const {factureNum,...r}=e; return {...r,statut:"facturer"}; }
      return e;
    });
    S.factures=S.factEditId?S.factures.map(x=>x.id===S.factEditId?{...f,id:S.factEditId}:x):[...S.factures,{...f,id:Date.now()}];
    fermer(); sauver("✓ Facture enregistrée");
  });
}

function bindReglages(){
  on("btn-rgsave","onclick",()=>{
    const g=id=>parseNum($(id).value);
    const r={tauxJour:g("rg-tj"),heuresJour:g("rg-hj"),tauxKm:g("rg-km"),tauxCotis:g("rg-cot"),prixBombe:g("rg-bombe")};
    if(!(r.tauxJour>0)||!(r.heuresJour>0)){ alert("Tarif journée et heures par journée doivent être supérieurs à 0."); return; }
    S.reglages=r; sauver("✓ Réglages enregistrés");
  });
  // Clients
  all("[data-hidecli]",b=>b.onclick=()=>{ const n=b.dataset.hidecli; basculerMasque(n); sauver(estMasque(n)?"🙈 Masqué du bandeau":"👁 Affiché dans le bandeau"); });
  all("[data-editcli]",b=>b.onclick=()=>{ S.editCli=b.dataset.editcli; render(); setTimeout(()=>$("cli-inp")?.focus(),50); });
  on("btn-clican","onclick",()=>{ S.editCli=null; render(); });
  on("btn-clisave","onclick",()=>{
    const nv=$("cli-inp").value.trim(), ov=S.editCli;
    if(!nv){ alert("Nom vide."); return; }
    const existant=dossiersTous().find(x=>x.toLowerCase()===nv.toLowerCase()&&x!==ov);
    if(existant&&!confirm(`« ${existant} » existe déjà : fusionner « ${ov} » avec ce client ?`)) return;
    renameClient(ov,existant||nv); S.editCli=null; sauver(existant?"✓ Clients fusionnés":"✓ Client renommé");
  });
  // Activités (tags)
  all("[data-editte]",b=>b.onclick=()=>{ S.editTagI=Number(b.dataset.editte); render(); setTimeout(()=>$("te-inp")?.focus(),50); });
  on("btn-cante","onclick",()=>{ S.editTagI=null; render(); });
  all("[data-savete]",b=>b.onclick=()=>{
    const i=Number(b.dataset.savete), nl=$("te-inp").value.trim(), ol=S.tags[i].label;
    if(!nl) return;
    S.tags[i].label=nl;
    S.entries=S.entries.map(e=>({...e,tags:(e.tags||[]).map(t=>t===ol?nl:t)}));
    if(S.filterTag===ol) S.filterTag=nl;
    S.editTagI=null; sauver("Activité renommée");
  });
  all("[data-delte]",b=>b.onclick=()=>{
    const i=Number(b.dataset.delte), lbl=S.tags[i].label;
    if(S.entries.some(e=>(e.tags||[]).includes(lbl))&&!confirm(`L'activité "${lbl}" est utilisée. La supprimer de la liste quand même ?`)) return;
    S.tags=S.tags.filter((_,j)=>j!==i); sauver("Activité supprimée");
  });
  all("[data-setcol]",d=>d.onclick=()=>{ S.tags[Number(d.dataset.setcol)].color=d.dataset.col; sauver(); });
  all("[data-newcol]",d=>d.onclick=()=>{ S.newTagLbl=$("nt-lbl").value; S.newTagCol=d.dataset.newcol; render(); });
  on("btn-addtag","onclick",()=>{
    const l=$("nt-lbl").value.trim();
    if(!l||S.tags.some(t=>t.label===l)){ alert("Nom vide ou déjà existant."); return; }
    S.tags.push({label:l,color:S.newTagCol}); S.newTagLbl=""; sauver("Activité ajoutée");
  });
  // Import
  on("imp-file","onchange",ev=>{
    const file=ev.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const data=JSON.parse(rd.result);
        if(!Array.isArray(data.entries)) throw new Error("format");
        if(!confirm(`Remplacer toutes les données par ce fichier ?\n${data.entries.length} entrées, ${(data.factures||[]).length} factures.`)){ ev.target.value=""; return; }
        applyData(data); S.view="journal"; sauver("✓ Sauvegarde importée");
      }catch(e){ alert("Fichier illisible : ce n'est pas une sauvegarde Qualisilva."); ev.target.value=""; }
    };
    rd.readAsText(file);
  });
}

// ═════════════════════════════════════════════════════════════
// 12. DÉMARRAGE
// ═════════════════════════════════════════════════════════════
render();
</script>
