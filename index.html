<body>
<div class="app" id="app"></div>
<div class="toast-box" id="toast"></div>
<script>
// ═══════════════════════════════════════════
// CONFIG  (connexion Google et fichier de données : inchangés)
// ═══════════════════════════════════════════
const CLIENT_ID = "967084691763-oo1vium2msv1svm44ap0n0pdejg3n07b.apps.googleusercontent.com";
const SCOPES    = "https://www.googleapis.com/auth/drive.appdata";
const FILE_NAME = "qualisilva-data.json";
const ADRESSE   = "11 rue de Mayenne, 72140 Sillé-le-Guillaume";
const PALETTE   = ["#2d5a27","#4a7c59","#6b8f71","#8b6914","#5c7a8a","#7a5c8a","#b05030","#2a6080","#888","#3a3a6a"];
const REGLAGES_DEFAUT = {tauxJour:550, heuresJour:8, tauxKm:0.5, tauxCotis:25.8, prixBombe:0};
const STATUTS = [
  {v:"facturer", l:"À facturer",     c:"#c0392b"},
  {v:"facture",  l:"Facturé",        c:"#2d5a27"},
  {v:"offert",   l:"Offert",         c:"#8b6914"},
  {v:"nonfact",  l:"Non facturable", c:"#888"},
];

// ═══════════════════════════════════════════
// ÉTAT GLOBAL
// ═══════════════════════════════════════════
let S = {
  screen:"login", view:"journal",
  entries:[], factures:[], reglages:{...REGLAGES_DEFAUT},
  tags:[
    {label:"Prospection",color:"#4a7c59"},
    {label:"Martelage",color:"#2d5a27"},
    {label:"Analyse/Rédaction",color:"#6b8f71"},
    {label:"Formation/Veille",color:"#8b6914"},
    {label:"Admin",color:"#7a5c8a"},
  ],
  filterTag:"Tous", filterDos:"Tous", filterStatut:"Tous",
  year:String(new Date().getFullYear()),
  editId:null, form:null, showDep:false, depAuto:false,
  factForm:null, factEditId:null,
  newTagLbl:"", newTagCol:"#4a7c59",
  editTagI:null, editTagV:"",
  syncStatus:"ok", token:null, fileId:null,
};

// ═══════════════════════════════════════════
// MIGRATION des anciennes données (rien n'est supprimé :
// les anciens champs « dépenses / recettes » sont rangés dans « ancien »)
// ═══════════════════════════════════════════
function migrateData(data){
  data=data||{};
  const tags=Array.isArray(data.tags)&&data.tags.length?data.tags:S.tags;
  const reglages={...REGLAGES_DEFAUT,...(data.reglages||{})};
  const factures=Array.isArray(data.factures)?data.factures:[];
  const entries=(data.entries||[]).map(e=>{
    if(Array.isArray(e.tags)) return {intervenants:1,statut:"facturer",bombes:0,frais:[],deplacement:null,remarque:"",dossier:"",...e};
    const nonFact=["Prospection","Formation/Veille"].includes(e.tag)||!e.dossier;
    return {
      id:e.id, date:e.date, heures:Number(e.heures)||0, description:e.description||"",
      tags:e.tag?[e.tag]:[], dossier:e.dossier||"",
      intervenants:1, statut:nonFact?"nonfact":"facturer",
      deplacement:e.deplacement||null, bombes:0, frais:[],
      remarque:e.remarque||"",
      ancien:{tag:e.tag, depenses:e.depenses||[], recettes:e.recettes||[]},
    };
  });
  return {version:2, entries, tags, factures, reglages};
}
const dataToSave = () => ({version:2, entries:S.entries, tags:S.tags, factures:S.factures, reglages:S.reglages});

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
const R = () => S.reglages;
const tauxH    = () => R().tauxJour/R().heuresJour;
const num      = v => Number(v)||0;
const parseNum = str => parseFloat(String(str??"").replace(",","."))||0;
const fraisKm  = e => e.deplacement ? num(e.deplacement.km)*R().tauxKm : 0;
const peage    = e => e.deplacement ? num(e.deplacement.peage) : 0;
const fraisConso = e => num(e.bombes)*R().prixBombe;
const fraisAutres= e => (e.frais||[]).reduce((s,f)=>s+num(f.montant),0);
const fraisTot = e => fraisKm(e)+peage(e)+fraisConso(e)+fraisAutres(e);
const valeurTemps = e => num(e.heures)*tauxH();
const valeurFacturable = e => num(e.heures)*tauxH()*(num(e.intervenants)||1);
const valeurEntree = e => (e.statut==="facturer"||e.statut==="facture")?valeurFacturable(e):valeurTemps(e);
const fmt  = n => (Math.round(Number(n||0)*100)/100).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ")+" €";
const fmt0 = n => Math.round(Number(n||0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")+" €";
const fmtH = h => (Math.round(Number(h||0)*100)/100).toString().replace(".",",")+" h";
const fmtD = d => { const [y,m,day]=(d||"").split("-"); return `${day}/${m}/${y}`; };
const esc  = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const tagCol = lbl => (S.tags.find(t=>t.label===lbl)||{color:"#888"}).color;
const statut = v => STATUTS.find(s=>s.v===v)||STATUTS[0];
const dossiers = () => [...new Set([...S.entries.map(e=>e.dossier),...S.factures.map(f=>f.dossier)].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const years = () => [...new Set([...S.entries.map(e=>(e.date||"").slice(0,4)),...S.factures.map(f=>(f.date||"").slice(0,4)),String(new Date().getFullYear())].filter(Boolean))].sort().reverse();
const inYear = d => (d||"").slice(0,4)===S.year;
const today = () => new Date().toISOString().slice(0,10);
let toastTimer;
const toast = msg => {
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2500);
};

// ═══════════════════════════════════════════
// GOOGLE DRIVE (inchangé, sauf le contenu sauvegardé)
// ═══════════════════════════════════════════
let saveTimer=null;
function scheduleSave(){
  setSyncDot("pending");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,2000);
}
async function doSave(){
  if(!S.token||!S.fileId)return;
  try{
    const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${S.fileId}?uploadType=media`,{
      method:"PATCH",
      headers:{Authorization:"Bearer "+S.token,"Content-Type":"application/json"},
      body:JSON.stringify(dataToSave())
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    setSyncDot("ok"); toast("✓ Sauvegardé");
  }catch(e){setSyncDot("err"); toast("⚠ Erreur de sauvegarde");}
}
function setSyncDot(s){
  S.syncStatus=s;
  const d=document.getElementById("sync-dot");
  if(d){d.className="dot dot-"+s; d.title={ok:"Synchronisé",pending:"Sauvegarde…",err:"Erreur"}[s]||"";}
}
async function signIn(){
  const params=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:location.origin+location.pathname,response_type:"token",scope:SCOPES,prompt:"select_account"});
  const popup=window.open("https://accounts.google.com/o/oauth2/v2/auth?"+params,"_blank","width=520,height=620");
  return new Promise((res,rej)=>{
    const t=setInterval(()=>{
      try{
        if(!popup||popup.closed){clearInterval(t);rej(new Error("fermé"));return;}
        const u=popup.location.href;
        if(u.includes("access_token")){clearInterval(t);popup.close();const h=new URLSearchParams(u.split("#")[1]);res(h.get("access_token"));}
      }catch(e){}
    },400);
  });
}
async function driveLoad(token){
  const r=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27qualisilva-data.json%27&fields=files(id)",{headers:{Authorization:"Bearer "+token}});
  const j=await r.json();
  if(j.files&&j.files.length>0){
    S.fileId=j.files[0].id;
    const r2=await fetch("https://www.googleapis.com/drive/v3/files/"+S.fileId+"?alt=media",{headers:{Authorization:"Bearer "+token}});
    return await r2.json();
  }else{
    const data=dataToSave();
    const meta=JSON.stringify({name:FILE_NAME,parents:["appDataFolder"]});
    const form=new FormData();
    form.append("metadata",new Blob([meta],{type:"application/json"}));
    form.append("file",new Blob([JSON.stringify(data)],{type:"application/json"}));
    const r2=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{Authorization:"Bearer "+token},body:form});
    const j2=await r2.json();
    S.fileId=j2.id;
    return data;
  }
}
function applyData(data){
  const d=migrateData(data);
  S.entries=d.entries; S.tags=d.tags; S.factures=d.factures; S.reglages=d.reglages;
}

// ═══════════════════════════════════════════
// CALCULS — les 3 niveaux d'analyse (année sélectionnée)
// ═══════════════════════════════════════════
function calcAnalyse(){
  const E=S.entries.filter(e=>inYear(e.date));
  const F=S.factures.filter(f=>inYear(f.date));
  const sum=(arr,fn)=>arr.reduce((s,x)=>s+fn(x),0);
  const heures=sum(E,e=>num(e.heures));
  const valeur=heures*tauxH();
  // Niveau 1 : par client et par activité (heures réparties entre les tags d'une entrée)
  const parClient={};
  const cl=d=>parClient[d]??={h:0,valeur:0,valeur2:0,aFacturer:0,offert:0,nonfact:0,facture:0,frais:0};
  E.forEach(e=>{
    const c=cl(e.dossier||"(sans client)");
    c.h+=num(e.heures); c.valeur+=valeurTemps(e); c.valeur2+=valeurEntree(e); c.frais+=fraisTot(e);
    if(e.statut==="facturer") c.aFacturer+=valeurFacturable(e);
    else if(e.statut==="offert") c.offert+=valeurTemps(e);
    else if(e.statut==="nonfact") c.nonfact+=valeurTemps(e);
  });
  F.forEach(f=>{cl(f.dossier||"(sans client)").facture+=num(f.honoraires);});
  const parTag={};
  E.forEach(e=>{const t=e.tags&&e.tags.length?e.tags:["(sans activité)"];t.forEach(l=>{parTag[l]=(parTag[l]||0)+num(e.heures)/t.length;});});
  // Niveau 2
  const honoraires=sum(F,f=>num(f.honoraires));
  const fraisFactures=sum(F,f=>num(f.frais));
  const offert=sum(E.filter(e=>e.statut==="offert"),valeurTemps);
  const nonfact=sum(E.filter(e=>e.statut==="nonfact"),valeurTemps);
  const resteAFacturer=sum(E.filter(e=>e.statut==="facturer"),valeurFacturable);
  const valeur2=sum(E,valeurEntree);
  // Niveau 3
  const ca=honoraires+fraisFactures;
  const cotis=ca*R().tauxCotis/100;
  const route=sum(E,e=>fraisKm(e)+peage(e));
  const conso=sum(E,fraisConso);
  const autres=sum(E,fraisAutres);
  const net=ca-cotis-route-conso-autres;
  const netSiFacture=net+resteAFacturer*(1-R().tauxCotis/100);
  const encaisse=sum(F,f=>num(f.encaisse));
  return {E,F,heures,valeur,parClient,parTag,honoraires,fraisFactures,offert,nonfact,resteAFacturer,
          ca,cotis,route,conso,autres,net,netH:heures>0?net/heures:0,
          netSiFacture,netSiFactureH:heures>0?netSiFacture/heures:0,
          valeur2,taux:valeur2>0?honoraires/valeur2:0,encaisse,cotisEncaisse:encaisse*R().tauxCotis/100};
}

function readForm(){
  const g=id=>document.getElementById(id);
  const dep=S.showDep?{
    adresseDepart: g("f-dep-from")?.value||ADRESSE,
    adresseArrivee: g("f-dep-to")?.value||"",
    km: parseNum(g("f-km")?.value),
    peage: parseNum(g("f-peage")?.value),
    allerRetour: true,
  }:null;
  return {
    date: g("f-date")?.value||today(),
    heures: parseNum(g("f-heures")?.value),
    description: g("f-desc")?.value||"",
    tags: [...(S.form.tags||[])],
    dossier: (g("f-dos")?.value||"").trim(),
    intervenants: S.form.intervenants||1,
    statut: S.form.statut||"facturer",
    deplacement: dep,
    bombes: parseNum(g("f-bombes")?.value),
    frais: S.form.frais||[],
    remarque: g("f-rem")?.value||"",
    ...(S.form.statut==="facture"&&S.form.factureNum?{factureNum:S.form.factureNum}:{}),
    ...(S.form.ancien?{ancien:S.form.ancien}:{}),
  };
}
function updateDepPreview(){
  const km=parseNum(document.getElementById("f-km")?.value);
  const pe=parseNum(document.getElementById("f-peage")?.value);
  const prev=document.getElementById("dep-prev");
  if(prev){const kmM=km*R().tauxKm;prev.innerHTML=(km>0||pe>0)?`${String(km).replace(".",",")} km × ${String(R().tauxKm).replace(".",",")} € = <strong>${fmt(kmM)}</strong>${pe>0?` · Péage <strong>${fmt(pe)}</strong>`:""} → <strong>${fmt(kmM+pe)}</strong>`:"";prev.style.display=(km>0||pe>0)?"":"none";}
}
function updateBombePreview(){
  const b=parseNum(document.getElementById("f-bombes")?.value);
  const prev=document.getElementById("bombe-prev");
  if(prev){prev.innerHTML=b>0?(R().prixBombe>0?`${String(b).replace(".",",")} × ${fmt(R().prixBombe)} = <strong>${fmt(b*R().prixBombe)}</strong>`:`Prix d'une bombe à régler dans Réglages`):"";prev.style.display=b>0?"":"none";}
}
function lastTripFor(client){
  if(!client) return null;
  const es=S.entries.filter(e=>e.dossier===client&&e.deplacement&&num(e.deplacement.km)>0).sort((a,b)=>b.date.localeCompare(a.date));
  return es[0]?.deplacement||null;
}
function setDepFields(d){
  document.getElementById("f-dep-from").value=d.adresseDepart||ADRESSE;
  document.getElementById("f-dep-to").value=d.adresseArrivee||"";
  document.getElementById("f-km").value=d.km?String(d.km).replace(".",","):"";
  document.getElementById("f-peage").value=d.peage?String(d.peage).replace(".",","):"";
  updateDepPreview();
}
function openDep(open){
  S.showDep=open;
  const tog=document.getElementById("dep-toggle"),inner=document.getElementById("dep-inner-wrap");
  tog.classList.toggle("open",open); tog.querySelector(".dep-ico").textContent=open?"−":"+"; inner.style.display=open?"":"none";
}
function refreshFraisList(){
  const el=document.getElementById("frais-list"); if(!el)return;
  el.innerHTML=fraisListHtml();
  document.querySelectorAll("[data-rmfrais]").forEach(b=>b.onclick=()=>{S.form.frais=S.form.frais.filter((_,i)=>i!=b.dataset.rmfrais);refreshFraisList();});
}

function downloadFile(name, content, mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
}
const csvQ = v => '"'+String(v??"").replace(/"/g,'""')+'"';
const csvN = n => (Math.round((Number(n)||0)*100)/100).toString().replace(".",",");
const csvJoin = rows => "﻿"+rows.map(r=>r.map(csvQ).join(";")).join("\r\n");
function exportJSON(){
  downloadFile(`qualisilva-sauvegarde-${today()}.json`, JSON.stringify({exporte_le:new Date().toISOString(),...dataToSave()},null,2), "application/json");
  toast("⬇ Sauvegarde téléchargée");
}
function exportCSV(){
  const head=["Date","Client","Activités","Description","Heures","Intervenants","Statut","N° facture","Valeur","Km A/R","Frais km","Péage","Bombes","Consommables","Autres frais","Détail autres frais","Total frais","Remarque"];
  const rows=[...S.entries].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[
    e.date,e.dossier,(e.tags||[]).join(", "),e.description,csvN(e.heures),e.intervenants||1,statut(e.statut).l,e.factureNum||"",
    csvN(valeurEntree(e)),
    e.deplacement?csvN(e.deplacement.km):"",csvN(fraisKm(e)),csvN(peage(e)),csvN(e.bombes),csvN(fraisConso(e)),csvN(fraisAutres(e)),
    (e.frais||[]).map(f=>`${f.libelle} : ${csvN(f.montant)}`).join(" | "),csvN(fraisTot(e)),e.remarque]);
  downloadFile(`qualisilva-journal-${today()}.csv`, csvJoin([head,...rows]), "text/csv;charset=utf-8");
  toast("⬇ Journal CSV téléchargé");
}
function exportKm(){
  const head=["Date","Départ","Arrivée","Client","Distance A/R (km)","Indemnité","Péage","Total frais","Description"];
  const rows=S.entries.filter(e=>e.deplacement&&(num(e.deplacement.km)>0||num(e.deplacement.peage)>0)).sort((a,b)=>a.date.localeCompare(b.date))
    .map(e=>[e.date,e.deplacement.adresseDepart,e.deplacement.adresseArrivee,e.dossier,csvN(e.deplacement.km),csvN(fraisKm(e)),csvN(peage(e)),csvN(fraisKm(e)+peage(e)),e.description]);
  downloadFile(`qualisilva-releve-km-${today()}.csv`, csvJoin([head,...rows]), "text/csv;charset=utf-8");
  toast("⬇ Relevé km téléchargé");
}

function bindLogin(){

    try{

      S.token=token;

function newForm(){

}

function bindApp(){
  const on=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el[ev]=fn;};
  const all=(sel,fn)=>document.querySelectorAll(sel).forEach(fn);

  // Navigation
  on("nav-journal","onclick",()=>{S.view="journal";render();});
  on("nav-factures","onclick",()=>{S.view="factures";render();});
  on("nav-analyse","onclick",()=>{S.view="analyse";render();});
  on("nav-reglages","onclick",()=>{S.view="reglages";render();});
  on("btn-new","onclick",()=>{S.form=newForm();S.showDep=false;S.depAuto=false;S.editId=null;S.view="saisie";render();});

  // Filtres
  all("[data-ftag]",b=>b.onclick=()=>{S.filterTag=b.dataset.ftag;render();});
  all("[data-fdos]",b=>b.onclick=()=>{S.filterDos=b.dataset.fdos;render();});
  all("[data-fstat]",b=>b.onclick=()=>{S.filterStatut=b.dataset.fstat;render();});
  all("[data-year]",b=>b.onclick=()=>{S.year=b.dataset.year;render();});

  // Entrées
  all("[data-edit]",b=>b.onclick=()=>{
    const e=S.entries.find(e=>String(e.id)===b.dataset.edit);if(!e)return;
    S.form=JSON.parse(JSON.stringify(e)); S.showDep=!!e.deplacement; S.depAuto=false; S.editId=e.id; S.view="saisie"; render();
  });
  all("[data-copy]",b=>b.onclick=()=>{
    const e=S.entries.find(e=>String(e.id)===b.dataset.copy);if(!e)return;
    const copy=JSON.parse(JSON.stringify(e)); delete copy.ancien; delete copy.factureNum;
    if(copy.statut==="facture") copy.statut="facturer";
    copy.id=Date.now(); copy.date=today();
    S.entries.push(copy); scheduleSave(); render(); toast("📋 Entrée dupliquée à la date du jour");
  });
  all("[data-del]",b=>b.onclick=()=>{
    if(!confirm("Supprimer cette entrée ?"))return;
    S.entries=S.entries.filter(e=>String(e.id)!==b.dataset.del); scheduleSave(); render(); toast("🗑 Supprimée");
  });

  // Formulaire de saisie
  if(S.view==="saisie"){
    on("btn-cancel","onclick",()=>{S.view="journal";render();});
    all("[data-tag]",b=>b.onclick=()=>{
      const l=b.dataset.tag, t=S.tags.find(x=>x.label===l);
      S.form.tags=S.form.tags||[];
      if(S.form.tags.includes(l)) S.form.tags=S.form.tags.filter(x=>x!==l); else S.form.tags.push(l);
      const sel=S.form.tags.includes(l);
      b.className="tp"+(sel?" on":""); b.style.background=sel?(t?.color||"#888"):""; b.style.borderColor=sel?(t?.color||"#888"):"transparent";
    });
    all("[data-int]",b=>b.onclick=()=>{S.form.intervenants=Number(b.dataset.int);document.querySelectorAll("[data-int]").forEach(x=>x.className="seg-b"+(x===b?" on":""));});
    all("[data-st]",b=>b.onclick=()=>{
      S.form.statut=b.dataset.st;
      document.querySelectorAll("[data-st]").forEach(x=>{const s=statut(x.dataset.st),sel=x===b;x.className="seg-b"+(sel?" on":"");x.style.background=sel?s.c:"";x.style.borderColor=sel?s.c:"";});
    });
    on("dep-toggle","onclick",()=>{
      const open=!S.showDep; openDep(open);
      if(open&&!document.getElementById("f-km").value){
        const t=lastTripFor((document.getElementById("f-dos").value||"").trim());
        if(t){setDepFields(t);S.depAuto=true;document.getElementById("dep-auto").style.display="";}
      }
    });
    // Nouveau client ou client existant : pré-remplir le trajet si le bloc est vide
    on("f-dos","onchange",()=>{
      const c=(document.getElementById("f-dos").value||"").trim();
      const t=lastTripFor(c);
      const kmEmpty=!parseNum(document.getElementById("f-km").value);
      if(t&&kmEmpty&&!S.editId){openDep(true);setDepFields(t);S.depAuto=true;document.getElementById("dep-auto").style.display="";}
    });
    ["f-km","f-peage"].forEach(id=>on(id,"oninput",updateDepPreview));
    on("f-bombes","oninput",updateBombePreview);
    updateDepPreview(); updateBombePreview();
    all("[data-rmfrais]",b=>b.onclick=()=>{S.form.frais=S.form.frais.filter((_,i)=>i!=b.dataset.rmfrais);refreshFraisList();});
    on("btn-addfrais","onclick",()=>{
      const lbl=(document.getElementById("nd-lbl").value||"").trim();
      const amt=parseNum(document.getElementById("nd-amt").value);
      if(!lbl||!(amt>0))return;
      S.form.frais=[...(S.form.frais||[]),{libelle:lbl,montant:amt}];
      document.getElementById("nd-lbl").value=""; document.getElementById("nd-amt").value="";
      refreshFraisList();
    });
    on("btn-save","onclick",()=>{
      const f=readForm();
      if(!f.description.trim()){alert("Merci d'ajouter une description.");return;}
      if(!f.tags.length){alert("Merci de choisir au moins une activité.");return;}
      const wasEdit=!!S.editId;
      if(wasEdit) S.entries=S.entries.map(e=>e.id===S.editId?{...f,id:S.editId}:e);
      else S.entries.push({...f,id:Date.now()});
      scheduleSave(); S.view="journal"; S.editId=null;
      render(); toast(wasEdit?"✓ Modifié":"✓ Entrée ajoutée");
    });
  }

  // Factures
  on("btn-fnew","onclick",()=>{S.factForm={numero:"",date:today(),dossier:"",honoraires:"",frais:"",encaisse:"",sel:{}};S.factEditId=null;render();});
  on("ff-dos","onchange",()=>{S.factForm=readFactForm();S.factForm.sel={};render();});
  on("btn-fcancel","onclick",()=>{S.factForm=null;S.factEditId=null;render();});
  all("[data-fedit]",b=>b.onclick=()=>{const f=S.factures.find(x=>String(x.id)===b.dataset.fedit);if(!f)return;S.factForm={...f,numeroOrig:f.numero,sel:{}};S.factEditId=f.id;render();window.scrollTo(0,0);});
  all("[data-fdel]",b=>b.onclick=()=>{
    const f=S.factures.find(x=>String(x.id)===b.dataset.fdel);if(!f)return;
    if(!confirm("Supprimer cette facture ? Ses entrées repasseront « À facturer »."))return;
    S.entries=S.entries.map(e=>{if(e.statut==="facture"&&e.factureNum===f.numero&&e.dossier===f.dossier){const {factureNum,...r}=e;return {...r,statut:"facturer"};}return e;});
    S.factures=S.factures.filter(x=>x.id!==f.id);scheduleSave();render();toast("🗑 Facture supprimée");});
  on("btn-fsave","onclick",()=>{
    const ff=readFactForm();
    if(!ff.numero||!ff.dossier){alert("Merci d'indiquer le numéro et le client.");return;}
    const f={numero:ff.numero,date:ff.date,dossier:ff.dossier,honoraires:num(ff.honoraires),frais:num(ff.frais),encaisse:num(ff.encaisse)};
    const cand=new Set(factCandidates(ff).map(e=>e.id));
    S.entries=S.entries.map(e=>{
      if(!cand.has(e.id)) return e;
      const chk=ff.sel[e.id]!==undefined?ff.sel[e.id]:(e.statut==="facturer"||e.factureNum===ff.numeroOrig);
      if(chk) return {...e,statut:"facture",factureNum:f.numero};
      if(e.statut==="facture"){const {factureNum,...r}=e;return {...r,statut:"facturer"};}
      return e;
    });
    if(S.factEditId) S.factures=S.factures.map(x=>x.id===S.factEditId?{...f,id:S.factEditId}:x);
    else S.factures.push({...f,id:Date.now()});
    S.factForm=null;S.factEditId=null;scheduleSave();render();toast("✓ Facture enregistrée");
  });

  // Exports
  on("btn-exp-csv","onclick",exportCSV);
  on("btn-exp-km","onclick",exportKm);
  on("btn-exp-json","onclick",exportJSON);

  // Réglages
  on("btn-rgsave","onclick",()=>{
    const g=id=>parseNum(document.getElementById(id).value);
    const r={tauxJour:g("rg-tj"),heuresJour:g("rg-hj"),tauxKm:g("rg-km"),tauxCotis:g("rg-cot"),prixBombe:g("rg-bombe")};
    if(!(r.tauxJour>0)||!(r.heuresJour>0)){alert("Tarif journée et heures par journée doivent être supérieurs à 0.");return;}
    S.reglages=r;scheduleSave();render();toast("✓ Réglages enregistrés");
  });
  on("imp-file","onchange",ev=>{
    const file=ev.target.files[0]; if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const data=JSON.parse(rd.result);
        if(!Array.isArray(data.entries)) throw new Error("format");
        if(!confirm(`Remplacer toutes les données par ce fichier ?\n${data.entries.length} entrées, ${(data.factures||[]).length} factures.`)){ev.target.value="";return;}
        applyData(data); scheduleSave(); S.view="journal"; render(); toast("✓ Sauvegarde importée");
      }catch(e){alert("Fichier illisible : ce n'est pas une sauvegarde Qualisilva.");ev.target.value="";}
    };
    rd.readAsText(file);
  });
  all("[data-editte]",b=>b.onclick=()=>{S.editTagI=parseInt(b.dataset.editte);S.editTagV=S.tags[S.editTagI].label;render();setTimeout(()=>document.getElementById("te-inp")?.focus(),50);});
  all("[data-savete]",b=>b.onclick=()=>{
    const idx=parseInt(b.dataset.savete);
    const nl=(document.getElementById("te-inp")?.value||"").trim();if(!nl)return;
    const ol=S.tags[idx].label;
    S.tags[idx].label=nl;
    S.entries=S.entries.map(e=>({...e,tags:(e.tags||[]).map(t=>t===ol?nl:t)}));
    if(S.filterTag===ol)S.filterTag=nl;
    S.editTagI=null;scheduleSave();render();toast("Activité renommée");
  });
  on("btn-cante","onclick",()=>{S.editTagI=null;render();});
  all("[data-delte]",b=>b.onclick=()=>{
    const idx=parseInt(b.dataset.delte),lbl=S.tags[idx].label;
    if(S.entries.some(e=>(e.tags||[]).includes(lbl))&&!confirm(`L'activité "${lbl}" est utilisée. La supprimer de la liste quand même ?`))return;
    S.tags=S.tags.filter((_,i)=>i!==idx);scheduleSave();render();toast("Activité supprimée");
  });
  all("[data-setcol]",d=>d.onclick=()=>{S.tags[parseInt(d.dataset.setcol)].color=d.dataset.col;scheduleSave();render();});
  all("[data-newcol]",d=>d.onclick=()=>{S.newTagLbl=document.getElementById("nt-lbl")?.value||"";S.newTagCol=d.dataset.newcol;render();});
  on("btn-addtag","onclick",()=>{
    const l=(document.getElementById("nt-lbl")?.value||"").trim();
    if(!l||S.tags.find(t=>t.label===l)){alert("Nom vide ou déjà existant.");return;}
    S.tags.push({label:l,color:S.newTagCol});
    S.newTagLbl="";scheduleSave();render();toast("Activité ajoutée");
  });
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
render();
</script>
</body>
</html>
